<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>訂單總覽</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    font-family: Arial;
    padding: 10px;
    background: #f8f9fa;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
}

.order {
    background: white;
    border: 1px solid #ddd;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
}

.order-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 8px;
}

.item,
.edit-item {
    font-size: 14px;
    color: #333;
}

.item {
    padding-left: 10px;
}

.edit-item {
    display: grid;
    grid-template-columns: minmax(120px, 1fr) 90px 90px 44px;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
}

.add-row {
    display: grid;
    grid-template-columns: minmax(120px, 1.1fr) minmax(90px, 1fr) 80px 70px;
    gap: 6px;
    margin-top: 10px;
}

.actions {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
    margin-top: 10px;
}

.print-range {
    display: flex;
    align-items: end;
    flex-wrap: wrap;
    gap: 8px;
}

@media (max-width: 768px) {
    .order-title {
        align-items: flex-start;
        flex-direction: column;
    }

    .edit-item,
    .add-row {
        grid-template-columns: 1fr;
    }

    .actions {
        justify-content: stretch;
    }

    .actions button {
        flex: 1;
    }
}
</style>
</head>

<body>

<div class="order mb-3">
    <div class="order-title"><span>訂購開放與匯款設定</span><span id="settingStatus" class="text-muted fw-normal"></span></div>
    <div class="row g-2">
        <div class="col-md-2 d-flex align-items-end"><div class="form-check form-switch mb-2"><input class="form-check-input" id="orderingEnabled" type="checkbox"><label class="form-check-label" for="orderingEnabled">開放訂購</label></div></div>
        <div class="col-md-3"><label class="form-label">開放時間（可留白）</label><input class="form-control" id="startAt" type="datetime-local"></div>
        <div class="col-md-3"><label class="form-label">結束時間（可留白）</label><input class="form-control" id="endAt" type="datetime-local"></div>
        <div class="col-md-4"><label class="form-label">銀行名稱</label><input class="form-control" id="bankName"></div>
        <div class="col-md-2"><label class="form-label">銀行代號</label><input class="form-control" id="bankCode" maxlength="10" inputmode="numeric" placeholder="例如：004"></div>
        <div class="col-md-4"><label class="form-label">匯款帳號</label><input class="form-control" id="bankAccount"></div>
        <div class="col-md-4"><label class="form-label">戶名</label><input class="form-control" id="accountName"></div>
        <div class="col-md-4 d-flex align-items-end"><button class="btn btn-success" onclick="saveSettings()">儲存設定</button></div>
    </div>
</div>

<div class="toolbar">
    <h3 class="m-0">📦 訂單總覽</h3>
    <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary btn-sm" onclick="loadData()">重新整理</button>
        <a class="btn btn-outline-secondary btn-sm" href="/sheet_check" target="_blank">欄位檢查</a>
        <a class="btn btn-outline-secondary btn-sm" href="/logout">登出</a>
    </div>
</div>

<div class="order mb-3">
    <div class="order-title"><span>期間訂單列印</span><span class="fw-normal text-muted">依訂單日期篩選，包含起訖日</span></div>
    <div class="print-range">
        <div><label class="form-label mb-1" for="printStart">開始日期</label><input class="form-control" id="printStart" type="date"></div>
        <div><label class="form-label mb-1" for="printEnd">結束日期</label><input class="form-control" id="printEnd" type="date"></div>
        <button class="btn btn-dark" onclick="printDateRange()">列印期間內訂單</button>
    </div>
</div>

<div id="list">載入中...</div>

<script>
let orders = [];
let products = [];
let editingId = null;

function escapeHtml(value){
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatGroup(g){
    if(g === "P") return "個人";
    if(g === "EXT") return "延伸";

    if(typeof g === "number"){
        return g + "組";
    }

    if(typeof g === "string"){
        if(g.startsWith("G")){
            return g.replace("G","") + "組";
        }
        return g;
    }

    return "";
}

function groupOptions(selected){
    let html = "";

    for(let i = 1; i <= 15; i++){
        const value = "G" + String(i).padStart(2, "0");
        html += `<option value="${value}" ${value === selected ? "selected" : ""}>${i}組</option>`;
    }

    html += `<option value="P" ${selected === "P" ? "selected" : ""}>個人</option>`;
    html += `<option value="EXT" ${selected === "EXT" ? "selected" : ""}>延伸</option>`;
    return html;
}

function productOptions(){
    let html = `<option value="">選擇商品</option>`;

    products.forEach((product, index) => {
        html += `<option value="${index}">${escapeHtml(product.name)}</option>`;
    });

    return html;
}

function sizeOptions(productIndex){
    const product = products[Number(productIndex)];

    if(!product){
        return `<option value="">選擇尺寸</option>`;
    }

    let html = `<option value="">選擇尺寸</option>`;

    (product.sizes || []).forEach((size, index) => {
        html += `<option value="${index}">${escapeHtml(size.size)} - ${Number(size.price || 0)}</option>`;
    });

    return html;
}

async function loadData(){
    document.getElementById("list").innerHTML = "載入中...";

    try {
        const [ordersResponse, productsResponse] = await Promise.all([
            fetch("/orders"),
            fetch("/products_grouped")
        ]);

        const ordersText = await ordersResponse.text();

        try {
            orders = JSON.parse(ordersText);
        } catch (e) {
            console.error("API不是JSON:", ordersText);
            document.getElementById("list").innerHTML = "後端錯誤（請看 Flask console）";
            return;
        }

        products = await productsResponse.json();
        renderOrders();
    } catch (err) {
        console.error("orders error:", err);
        document.getElementById("list").innerHTML = "載入失敗（請看 console）";
    }
}

function renderOrders(){
    if(!Array.isArray(orders) || orders.length === 0){
        document.getElementById("list").innerHTML = "沒有訂單";
        return;
    }

    document.getElementById("list").innerHTML = orders.map(order => {
        if(editingId === order.order_id){
            return renderEditOrder(order);
        }

        return renderReadOnlyOrder(order);
    }).join("");
}

function renderReadOnlyOrder(order){
    const total = Number(order.total || 0);
    const items = (order.items || []).map(item => {
        const name = item.product_name || item.name || "";
        const size = item.size || "";
        const qty = Number(item.qty || 0);
        const price = Number(item.price || 0);

        if(!name) return "";

        return `
            <div class="item">
                ${escapeHtml(name)} ${size ? escapeHtml(size) : ""} x ${qty} = ${price * qty}
            </div>`;
    }).join("");

    return `
        <div class="order">
            <div class="order-title">
                <span>訂單：${escapeHtml(order.order_id)} ｜ 訂購人：${escapeHtml(order.customer_name || "未填寫")} ｜ 時間：${escapeHtml(order.date || "")} ｜ 總額：${total}</span>
                <span class="d-flex gap-1">
                    <button class="btn btn-outline-dark btn-sm" onclick="printOneOrder('${escapeHtml(order.order_id)}')">列印</button>
                    <button class="btn btn-outline-primary btn-sm" onclick="editOrder('${escapeHtml(order.order_id)}')">修改</button>
                </span>
            </div>
            ${items}
        </div>`;
}

function renderEditOrder(order){
    const items = (order.items || []).map((item, index) => {
        const name = item.product_name || item.name || "";
        const size = item.size || "";
        const qty = Number(item.qty || 0);
        const price = Number(item.price || 0);

        return `
            <div class="edit-item">
                <div>${escapeHtml(name)} ${size ? escapeHtml(size) : ""}<br><small>單價：${price}</small></div>
                <input class="form-control form-control-sm" type="number" min="1" value="${qty}" id="qty-${index}">
                <div>${price * qty}</div>
                <button class="btn btn-outline-danger btn-sm" onclick="removeEditItem(${index})">X</button>
            </div>`;
    }).join("");

    return `
        <div class="order">
            <div class="order-title">
                <span>修改訂單：${escapeHtml(order.order_id)}</span>
            </div>

            <label class="form-label mb-1">組別</label>
            <select class="form-select form-select-sm mb-2" id="editGroup">
                ${groupOptions(order.group)}
            </select>

            <div id="editItems">${items}</div>

            <div class="add-row">
                <select class="form-select form-select-sm" id="addProduct" onchange="changeAddProduct()">
                    ${productOptions()}
                </select>
                <select class="form-select form-select-sm" id="addSize">
                    <option value="">選擇尺寸</option>
                </select>
                <input class="form-control form-control-sm" id="addQty" type="number" min="1" value="1">
                <button class="btn btn-outline-success btn-sm" onclick="addEditItem()">新增</button>
            </div>

            <div class="actions">
                <button class="btn btn-secondary btn-sm" onclick="cancelEdit()">取消</button>
                <button class="btn btn-success btn-sm" onclick="saveEdit()">儲存</button>
            </div>
        </div>`;
}

function editOrder(orderId){
    editingId = orderId;
    renderOrders();
}

function cancelEdit(){
    editingId = null;
    renderOrders();
}

function currentEditOrder(){
    return orders.find(order => order.order_id === editingId);
}

function removeEditItem(index){
    const order = currentEditOrder();
    order.items.splice(index, 1);
    renderOrders();
}

function changeAddProduct(){
    document.getElementById("addSize").innerHTML = sizeOptions(document.getElementById("addProduct").value);
}

function addEditItem(){
    const order = currentEditOrder();
    const productIndex = document.getElementById("addProduct").value;
    const sizeIndex = document.getElementById("addSize").value;
    const qty = Number(document.getElementById("addQty").value || 0);
    const product = products[Number(productIndex)];
    const size = product && product.sizes ? product.sizes[Number(sizeIndex)] : null;

    if(!product || !size || qty <= 0){
        alert("請選擇商品、尺寸與數量");
        return;
    }

    const existing = order.items.find(item => item.sku === size.sku);

    if(existing){
        existing.qty = Number(existing.qty || 0) + qty;
    } else {
        order.items.push({
            sku: size.sku,
            name: product.name,
            product_name: product.name,
            size: size.size,
            price: Number(size.price || 0),
            qty
        });
    }

    renderOrders();
}

function collectEditItems(order){
    return (order.items || []).map((item, index) => ({
        sku: item.sku || "",
        name: item.name || item.product_name || "",
        product_name: item.product_name || item.name || "",
        size: item.size || "",
        price: Number(item.price || 0),
        qty: Number(document.getElementById(`qty-${index}`)?.value || item.qty || 0)
    })).filter(item => item.qty > 0);
}

async function saveEdit(){
    const order = currentEditOrder();
    const group = document.getElementById("editGroup").value;
    const items = collectEditItems(order);

    if(items.length === 0){
        alert("訂單至少要有一個品項");
        return;
    }

    try {
        const response = await fetch(`/orders/${encodeURIComponent(order.order_id)}`, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ group, items })
        });

        const result = await response.json();

        if(!response.ok){
            alert(result.message || "更新失敗");
            return;
        }

        const index = orders.findIndex(item => item.order_id === order.order_id);
        orders[index] = result.order;
        editingId = null;
        renderOrders();
        alert("訂單已更新");
    } catch (err) {
        console.error("save order error:", err);
        alert("更新失敗");
    }
}

async function loadSettings(){
    const response = await fetch("/api/settings");
    if(!response.ok) return;
    const settings = await response.json();
    document.getElementById("orderingEnabled").checked = !!settings.ordering_enabled;
    document.getElementById("startAt").value = settings.start_at || "";
    document.getElementById("endAt").value = settings.end_at || "";
    document.getElementById("bankName").value = settings.bank_name || "";
    document.getElementById("bankCode").value = settings.bank_code || "";
    document.getElementById("bankAccount").value = settings.bank_account || "";
    document.getElementById("accountName").value = settings.account_name || "";
}

async function saveSettings(){
    const payload = {
        ordering_enabled: document.getElementById("orderingEnabled").checked,
        start_at: document.getElementById("startAt").value,
        end_at: document.getElementById("endAt").value,
        bank_name: document.getElementById("bankName").value.trim(),
        bank_code: document.getElementById("bankCode").value.trim(),
        bank_account: document.getElementById("bankAccount").value.trim(),
        account_name: document.getElementById("accountName").value.trim()
    };
    const response = await fetch("/api/settings", {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
    const result = await response.json();
    if(!response.ok) return alert(result.message || "設定儲存失敗");
    document.getElementById("settingStatus").textContent = result.ordering.message;
    alert("設定已儲存");
}

function orderPrintHtml(order){
    const items = (order.items || []).map(item => {
        const name = item.product_name || item.name || "";
        const size = item.size || "";
        const qty = Number(item.qty || 0);
        const price = Number(item.price || 0);
        return `<tr><td>${escapeHtml(name)}</td><td>${escapeHtml(size)}</td><td class="number">${qty}</td><td class="number">${price.toLocaleString()}</td><td class="number">${(price * qty).toLocaleString()}</td></tr>`;
    }).join("");
    return `<section class="printed-order">
        <h1>取貨訂單</h1>
        <div class="meta"><b>訂單編號：</b>${escapeHtml(order.order_id)}<br><b>訂購人：</b>${escapeHtml(order.customer_name || "未填寫")}<br><b>訂單時間：</b>${escapeHtml(order.date || "")}</div>
        <table><thead><tr><th>品項</th><th>尺寸／規格</th><th>數量</th><th>單價</th><th>小計</th></tr></thead><tbody>${items}</tbody><tfoot><tr><td colspan="4">總額</td><td class="number">NT$ ${Number(order.total || 0).toLocaleString()}</td></tr></tfoot></table>
        <div class="check"><span>□ 商品已核對</span><span>□ 已完成取貨</span><span>核對人：____________</span></div>
    </section>`;
}

function openPrintWindow(selectedOrders, title){
    if(!selectedOrders.length){
        alert("選定範圍內沒有訂單");
        return;
    }
    const win = window.open("", "_blank");
    if(!win){
        alert("瀏覽器阻擋了列印視窗，請允許此網站開啟彈出式視窗");
        return;
    }
    win.document.write(`<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>${escapeHtml(title)}</title><style>
        @page{size:A4;margin:14mm}body{font-family:Arial,"Microsoft JhengHei",sans-serif;color:#111;margin:0}.printed-order{page-break-after:always}.printed-order:last-child{page-break-after:auto}h1{font-size:24px;margin:0 0 12px}.meta{line-height:1.8;margin-bottom:14px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #444;padding:8px;text-align:left}th{background:#eee}.number{text-align:right}tfoot{font-weight:bold}.check{display:flex;gap:28px;margin-top:24px;font-size:16px}@media print{button{display:none}}
    </style></head><body>${selectedOrders.map(orderPrintHtml).join("")}<script>window.onload=()=>window.print();<\/script></body></html>`);
    win.document.close();
}

function printOneOrder(orderId){
    const order = orders.find(item => item.order_id === orderId);
    if(order) openPrintWindow([order], `訂單-${orderId}`);
}

function printDateRange(){
    const start = document.getElementById("printStart").value;
    const end = document.getElementById("printEnd").value;
    if(!start || !end){
        alert("請選擇開始日期和結束日期");
        return;
    }
    if(start > end){
        alert("開始日期不能晚於結束日期");
        return;
    }
    const selected = orders.filter(order => {
        const date = String(order.date || "").slice(0, 10);
        return date >= start && date <= end;
    });
    openPrintWindow(selected, `${start} 至 ${end} 訂單`);
}

window.addEventListener("DOMContentLoaded", () => {
    const today = new Date().toLocaleDateString("en-CA");
    document.getElementById("printStart").value = today;
    document.getElementById("printEnd").value = today;
    loadSettings();
    loadData();
});
</script>

</body>
</html>
