<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>線上訂購</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
html,body{height:100%;margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#fff}.pos{display:grid;grid-template-columns:30% 25% 45%;height:100vh}.panel{padding:10px;overflow:hidden;border-right:1px solid #eee}h4{font-size:16px;margin-bottom:8px}.step{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:6px;border-radius:50%;background:#0d6efd;color:#fff;font-size:14px}.group-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.group-btn,.product-btn,.size-btn{padding:8px;border:1px solid #ccc;border-radius:5px;background:#fff}.group-btn{padding:6px;font-size:12px}.group-btn.active,.size-btn.active{background:#0d6efd;color:#fff}.group-btn:disabled:not(.active){background:#eee;color:#999}.product-grid{max-height:calc(100vh - 145px);overflow-y:auto}.product-section-title{font-size:16px;font-weight:bold;margin:10px 0 5px;padding-bottom:4px;border-bottom:2px solid #0d6efd}.product-section-title:first-child{margin-top:0}.product-items{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.product-empty{color:#777;font-size:13px}.product-btn{font-size:13px}.product-btn.active{background:#e7f1ff;border:2px solid #0d6efd}.selected-product{padding:8px;margin-bottom:8px;border-radius:6px;background:#e7f1ff;color:#084298;font-weight:bold}.size-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;min-height:42px}.qty-display{font-size:28px;text-align:center;padding:8px;background:#f1f1f1;border-radius:6px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.keypad button{height:48px;font-size:18px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.status{font-size:13px;color:#6c757d}.cart{height:calc(100vh - 250px);overflow-y:auto;border:1px solid #ddd;border-radius:6px;padding:6px}.cart-empty{color:#777;text-align:center;padding:30px 5px}.cart-item{padding:8px 4px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}.cart-actions{display:flex;gap:4px}.cart-actions button{min-width:30px}.total{font-size:22px;font-weight:bold;margin-top:8px;display:flex;justify-content:space-between}.mobile-cart-bar,.toast-message{display:none}.closed{position:fixed;inset:0;background:#f8f9fa;display:grid;place-items:center;z-index:20;text-align:center;padding:20px}.success-card{max-width:650px;margin:35px auto;padding:28px;border:1px solid #ddd;border-radius:12px;box-shadow:0 6px 24px #0001}.money{font-size:24px;font-weight:bold;color:#b02a37}
@media(max-width:768px){html,body{height:auto;overflow:auto;scroll-behavior:smooth;background:#f5f6f8}.pos{display:block;height:auto;min-height:100vh;padding-bottom:82px}.panel{margin:10px;padding:14px;overflow:visible;border:1px solid #ddd;border-radius:12px;background:#fff;box-shadow:0 2px 8px #0000000d}h4{font-size:20px}.step{width:30px;height:30px;font-size:17px}.group-grid{grid-template-columns:repeat(4,1fr);gap:8px}.product-grid{max-height:none}.product-items{grid-template-columns:repeat(3,1fr);gap:6px}.product-section-title{font-size:20px;margin-top:18px}.size-grid{grid-template-columns:repeat(3,1fr)}.group-btn,.product-btn,.size-btn{min-height:58px;font-size:17px;padding:10px 5px;touch-action:manipulation}.product-btn.active,.size-btn.active{box-shadow:0 0 0 2px #0d6efd}.qty-display{font-size:34px;padding:10px}.keypad{gap:8px}.keypad button{height:62px;font-size:24px;border:1px solid #bbb;border-radius:8px;background:#fff;touch-action:manipulation}.cart{height:auto;max-height:none;min-height:150px}.cart-item{font-size:17px;padding:12px 4px}.cart-actions button{min-width:44px;min-height:44px;border:1px solid #aaa;border-radius:6px;background:#fff}.btn{min-height:48px}.total{font-size:27px}.mobile-cart-bar{position:fixed;display:flex;align-items:center;justify-content:space-between;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:15;padding:12px 16px;border:0;border-radius:12px;background:#198754;color:#fff;box-shadow:0 5px 20px #0005;font-size:17px;font-weight:bold}.mobile-cart-bar.empty{background:#6c757d}.toast-message{position:fixed;display:block;left:50%;bottom:88px;z-index:30;transform:translate(-50%,20px);padding:10px 18px;border-radius:30px;background:#212529;color:#fff;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast-message.show{opacity:1;transform:translate(-50%,0)}}
</style></head>
<body>
<div id="closed" class="closed d-none"><div><h1 class="h3">目前無法訂購</h1><p id="closedMessage"></p><a href="/login" class="btn btn-outline-secondary">管理員登入</a></div></div>
<main id="orderPage" class="pos">
<section class="panel" id="productPanel"><div class="topbar"><h4 class="m-0"><span class="step">1</span>選擇組別與商品</h4><span id="status" class="status">讀取中…</span></div><div class="group-grid" id="groupList"></div><div id="groupHint" class="small text-danger mt-1">請先選擇組別；選定後無法更換</div><hr><div class="product-grid" id="productList"></div></section>
<section class="panel" id="optionPanel"><h4><span class="step">2</span>選擇尺寸與數量</h4><div id="selectedProduct" class="selected-product d-none"></div><div class="size-grid" id="sizeList"><span class="text-muted">請先選擇商品</span></div><hr><h4>數量</h4><div class="qty-display" id="qtyDisplay">0</div><div class="keypad mt-2"><button onclick="inputQty(1)">1</button><button onclick="inputQty(2)">2</button><button onclick="inputQty(3)">3</button><button onclick="inputQty(4)">4</button><button onclick="inputQty(5)">5</button><button onclick="inputQty(6)">6</button><button onclick="inputQty(7)">7</button><button onclick="inputQty(8)">8</button><button onclick="inputQty(9)">9</button><button onclick="clearQty()">C</button><button onclick="inputQty(0)">0</button><button class="btn btn-success" onclick="addToCart()">加入</button></div></section>
<section class="panel" id="cartPanel"><div class="topbar"><h4 class="m-0"><span class="step">3</span>確認與送出</h4><a href="/login" class="btn btn-outline-secondary btn-sm">管理員</a></div><label class="form-label mb-1" for="customerName">訂購人姓名</label><input id="customerName" class="form-control mb-2" maxlength="50" placeholder="請填寫姓名" autocomplete="name" required><div class="cart" id="cart"><div class="cart-empty">購物車是空的</div></div><div class="total"><span>總計</span><span id="total">NT$ 0</span></div><button id="submitBtn" class="btn btn-success w-100 mt-2" onclick="submitOrder()">確認送出訂單</button></section>
</main>
<button id="mobileCartBar" class="mobile-cart-bar empty" onclick="scrollToCart()"><span id="mobileCartCount">購物車是空的</span><span id="mobileCartTotal">NT$ 0</span></button><div id="toast" class="toast-message"></div>
<main id="successPage" class="d-none"></main>
<script>
let products=[],selectedGroup=null,selectedProduct=null,selectedSize=null,qty='0',cart=[];
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function init(){renderGroups();try{const [p,s]=await Promise.all([fetch('/products_grouped').then(r=>r.json()),fetch('/ordering_status').then(r=>r.json())]);products=p.filter(x=>String(x.active).toUpperCase()!=='FALSE');document.querySelector('#status').textContent=s.message;if(!s.is_open){document.querySelector('#closedMessage').textContent=s.message;document.querySelector('#closed').classList.remove('d-none')}renderProducts()}catch(e){document.querySelector('#status').textContent='載入失敗';alert('目前無法載入商品，請稍後再試。')}}
function renderGroups(){let html='';for(let i=1;i<=15;i++)html+=`<button class="group-btn" onclick="selectGroup('G${String(i).padStart(2,'0')}',this)">${i}組</button>`;html+='<button class="group-btn" onclick="selectGroup(\'P\',this)">個人</button>';document.querySelector('#groupList').innerHTML=html}
function selectGroup(group,el){if(selectedGroup)return;selectedGroup=group;el.classList.add('active');document.querySelectorAll('.group-btn').forEach(button=>button.disabled=true);document.querySelector('#groupHint').className='small text-success mt-1';document.querySelector('#groupHint').textContent=`已選擇：${group==='P'?'個人':Number(group.slice(1))+'組'}`}
function renderProducts(){const section=category=>{const list=products.filter(p=>(p.category||'衣物')===category);return `<div class="product-section-title">${category}</div><div class="product-items">`+(list.length?list.map(p=>`<button class="product-btn" onclick="selectProduct('${esc(p.id)}',this)">${esc(p.name)}</button>`).join(''):`<div class="product-empty">目前沒有${category}商品</div>`)+`</div>`};document.querySelector('#productList').innerHTML=section('衣物')+section('物品')}
function selectProduct(id,el){selectedProduct=products.find(p=>p.id===id);selectedSize=null;document.querySelectorAll('.product-btn').forEach(x=>x.classList.remove('active'));el.classList.add('active');const label=document.querySelector('#selectedProduct');label.textContent='已選商品：'+selectedProduct.name;label.classList.remove('d-none');document.querySelector('#sizeList').innerHTML=selectedProduct?.sizes?.length?selectedProduct.sizes.map(s=>`<button class="size-btn" onclick="selectSize('${esc(s.sku)}',this)">${esc(s.size)}</button>`).join(''):'<span class="text-muted">無可選規格</span>';if(innerWidth<=768)setTimeout(()=>document.querySelector('#optionPanel').scrollIntoView({behavior:'smooth',block:'start'}),100)}
function selectSize(sku,el){selectedSize=selectedProduct.sizes.find(s=>s.sku===sku);document.querySelectorAll('.size-btn').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function inputQty(n){if(qty==='0')qty='';qty+=n;qty=qty.replace(/^0+/,'')||'0';document.querySelector('#qtyDisplay').textContent=qty}
function clearQty(){qty='0';document.querySelector('#qtyDisplay').textContent=qty}
function addToCart(){if(!selectedGroup)return alert('請先選擇組別');if(!selectedProduct)return alert('請先選擇商品');if(!selectedSize)return alert('請選擇尺寸或規格');const amount=parseInt(qty);if(!amount)return alert('請輸入數量');const old=cart.find(x=>x.sku===selectedSize.sku);old?old.qty+=amount:cart.push({sku:selectedSize.sku,name:selectedProduct.name,size:selectedSize.size,price:Number(selectedSize.price),qty:amount});showToast(`已加入：${selectedProduct.name} ${selectedSize.size} × ${amount}`);clearQty();renderCart()}
function changeQty(index,difference){cart[index].qty+=difference;if(cart[index].qty<=0)cart.splice(index,1);renderCart()}
function removeItem(index){cart.splice(index,1);renderCart()}
function renderCart(){let total=0;document.querySelector('#cart').innerHTML=cart.length?cart.map((item,index)=>{const sum=item.price*item.qty;total+=sum;return `<div class="cart-item"><div><b>${esc(item.name)}</b> ${esc(item.size)}<br>${item.qty} × NT$${item.price.toLocaleString()} = NT$${sum.toLocaleString()}</div><div class="cart-actions"><button aria-label="減少數量" onclick="changeQty(${index},-1)">−</button><button aria-label="增加數量" onclick="changeQty(${index},1)">＋</button><button aria-label="刪除商品" onclick="removeItem(${index})" class="text-danger">×</button></div></div>`}).join(''):'<div class="cart-empty">購物車是空的</div>';const count=cart.reduce((sum,item)=>sum+item.qty,0),formatted='NT$ '+total.toLocaleString();document.querySelector('#total').textContent=formatted;document.querySelector('#mobileCartCount').textContent=count?`購物車 ${count} 件`:'購物車是空的';document.querySelector('#mobileCartTotal').textContent=formatted;document.querySelector('#mobileCartBar').classList.toggle('empty',!count)}
function scrollToCart(){document.querySelector('#cartPanel').scrollIntoView({behavior:'smooth',block:'start'})}
let toastTimer;function showToast(message){const toast=document.querySelector('#toast');toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
async function submitOrder(){const customerName=document.querySelector('#customerName').value.trim();if(!selectedGroup)return alert('請先選擇組別');if(!customerName)return alert('請填寫訂購人姓名');if(!cart.length)return alert('購物車是空的');if(!confirm('確定送出訂單？'))return;const btn=document.querySelector('#submitBtn');btn.disabled=true;btn.textContent='送出中…';try{const response=await fetch('/submit_order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({group:selectedGroup,customer_name:customerName,items:cart})});const result=await response.json();if(!response.ok)throw Error(result.message||'送出失敗');showSuccess(result)}catch(error){alert(error.message);btn.disabled=false;btn.textContent='確認送出訂單'}}
function showSuccess(order){const lines=order.items.map(x=>`${x.name} ${x.size} × ${x.qty}　NT$ ${(x.price*x.qty).toLocaleString()}`),bankCode=order.payment.bank_code||'';window.currentReceipt=`訂購完成，謝謝訂購\n\n訂單編號：${order.order_id}\n訂購人：${order.customer_name}\n訂單時間：${order.order_time}\n\n訂單明細\n${lines.join('\n')}\n\n總金額：NT$ ${order.total.toLocaleString()}\n匯款銀行：${order.payment.bank_name}\n銀行代號：${bankCode||'-'}\n匯款帳號：${order.payment.bank_account}\n戶名：${order.payment.account_name||'-'}`;document.querySelector('#orderPage').classList.add('d-none');document.querySelector('#mobileCartBar').classList.add('d-none');const page=document.querySelector('#successPage');page.classList.remove('d-none');page.innerHTML=`<section class="success-card text-center"><div class="display-5 text-success">✓</div><h1 class="h3">訂購完成，謝謝訂購</h1><p>訂單編號：<b>${esc(order.order_id)}</b><br>訂單時間：${esc(order.order_time)}</p><hr><div class="text-start">${lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div><hr><p>請匯款至</p><div class="money">NT$ ${order.total.toLocaleString()}</div><p>${esc(order.payment.bank_name)}${bankCode?`（銀行代號：${esc(bankCode)}）`:''}<br><b>${esc(order.payment.bank_account)}</b>${order.payment.account_name?`<br>戶名：${esc(order.payment.account_name)}`:''}</p><button class="btn btn-primary" onclick="downloadReceipt('${esc(order.order_id)}')">下載儲存訂單</button> <button class="btn btn-outline-secondary" onclick="location.reload()">繼續訂購</button></section>`}
function downloadReceipt(id){const blob=new Blob(['\ufeff'+window.currentReceipt],{type:'text/plain;charset=utf-8'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`訂單-${id}.txt`;link.click();URL.revokeObjectURL(link.href)}
init();
</script></body></html>
